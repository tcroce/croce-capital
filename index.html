<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Croce Capital</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 80% -10%,#18315c55,transparent 28%),#080c13;display:flex}.sidebar{width:220px;padding:24px 16px;border-right:1px solid #ffffff10;position:fixed;inset:0 auto 0 0}.brand{font-weight:900;letter-spacing:3px;font-size:18px}.brand small{display:block;color:#7cf4d7;font-size:9px;letter-spacing:5px;margin-top:4px}.workspace{margin:24px 0;padding:13px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff05}.workspace small{color:#66758b}.workspace b{display:block;margin-top:6px}.nav button{width:100%;text-align:left;padding:11px;border:0;border-radius:9px;background:transparent;color:#8190a5;margin:2px 0;cursor:pointer}.nav button:hover{background:#65e3c810;color:#8ff3dd}.main{margin-left:220px;flex:1;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:4px 0 0}.muted{color:#66758b;font-size:10px;letter-spacing:1.4px}.mode{display:flex;background:#0d141f;border:1px solid #ffffff12;border-radius:11px;padding:4px}.mode button{border:0;background:transparent;color:#69778b;padding:9px 13px;border-radius:8px;font-size:10px;font-weight:800;cursor:pointer}.mode button.on{background:#162235;color:#8ff3dd}.banner{margin-top:22px;padding:10px 13px;border:1px solid #5c8dff25;background:#5c8dff0b;border-radius:10px;color:#9db3ff;font-size:11px}.hero,.card{border:1px solid #ffffff10;background:#0d131d;border-radius:18px}.hero{margin-top:13px;padding:30px;background:linear-gradient(105deg,#101b2a,#0c121d 65%,#111827)}.hero span{color:#77ecd2;font-size:10px;font-weight:800;letter-spacing:1.5px}.hero h2{font-size:30px;margin:13px 0 8px}.hero p{color:#8b98aa}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:14px 0}.card{padding:18px}.card label{font-size:10px;color:#738095}.card h3{font-size:24px;margin:10px 0 3px}.card small{color:#68e5c8}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:14px}.card h4{margin:4px 0 18px}.stage{margin:12px 0}.stage div:first-child{display:flex;justify-content:space-between;color:#8b98aa;font-size:11px}.track{height:6px;background:#17202d;border-radius:10px;margin-top:6px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#5b8dff,#6ce8cd)}.campaign{text-align:center}.campaign .big{font-size:36px;font-weight:900;margin:26px 0 5px}.campaign p{color:#738095}.liveEmpty{padding:35px;text-align:center;color:#718096}.liveEmpty b{display:block;color:#dce5f2;font-size:16px;margin-bottom:8px}@media(max-width:850px){.sidebar{width:68px;padding:20px 8px}.brand{font-size:0}.brand:before{content:'CC';font-size:16px}.brand small,.workspace{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:18px}.main{margin-left:68px;padding:18px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">CROCE<small>CAPITAL</small></div><div class="workspace"><small>WORKSPACE</small><b>Fast Business Fundz</b></div><div class="nav"><button class="active">Dashboard</button><button>Lead Finder</button><button>Leads</button><button>Lists</button><button>Pipeline</button><button>Campaigns</button><button>Templates</button><button>Analytics</button><button>Settings</button></div></aside><main class="main"><div class="top"><div><div class="muted">FAST BUSINESS FUNDZ · WORKSPACE</div><h1>Dashboard</h1></div><div class="mode"><button id="live">LIVE</button><button id="demo" class="on">DEMO</button></div></div><div id="root"></div></main></div><script>const demo={leads:'1,284',qualified:'347',pipeline:'$486K',funded:'$128K',apps:23,open:'38.6%',delivered:182,replies:21};const live={leads:'0',qualified:'0',pipeline:'$0',funded:'$0',apps:0,open:'0%',delivered:0,replies:0};let mode='demo';const root=document.getElementById('root'),lb=document.getElementById('live'),db=document.getElementById('demo');function draw(){const d=mode==='demo'?demo:live;root.innerHTML=(mode==='demo'?'<div class="banner"><b>DEMO MODE</b> — Sample numbers are clearly separated from your live Fast Business Fundz workspace.</div>':'')+'<section class="hero"><span>✦ CROCE INTELLIGENCE</span><h2>'+(mode==='demo'?'Good afternoon, Thomas.':'Live workspace')+'</h2><p>'+(mode==='demo'?'Your demo pipeline has <b>'+d.apps+' submitted applications</b> and <b>'+d.pipeline+'</b> in active opportunities.':'Live numbers populate only from real workspace records. No demo data is mixed into Live mode.')+'</p></section><section class="stats">'+[['New Leads',d.leads],['Qualified',d.qualified],['Active Pipeline',d.pipeline],['Funded',d.funded]].map(x=>'<div class="card"><label>'+x[0]+'</label><h3>'+x[1]+'</h3><small>'+(mode==='demo'?'Demo metric':'Live metric')+'</small></div>').join('')+'</section><div class="grid"><section class="card"><div class="muted">DEAL PIPELINE</div><h4>Funding funnel</h4>'+(mode==='demo'?[['New',184,100],['Interested',62,72],['App Sent',41,58],['Submitted',23,43],['Offer Given',12,28],['Funded',8,18]].map(x=>'<div class="stage"><div><span>'+x[0]+'</span><b>'+x[1]+'</b></div><div class="track"><i style="width:'+x[2]+'%"></i></div></div>').join(''):'<div class="liveEmpty"><b>No live pipeline data yet</b>Add real leads and move them through the pipeline.</div>')+'</section><section class="card campaign"><div class="muted">CAMPAIGN PULSE</div><div class="big">'+d.open+'</div><p>Open rate</p><p>'+d.delivered+' delivered · '+d.replies+' replies</p></section></div>'}function setMode(m){mode=m;lb.classList.toggle('on',m==='live');db.classList.toggle('on',m==='demo');draw()}lb.onclick=()=>setMode('live');db.onclick=()=>setMode('demo');draw();</script><script src="app.js"></script><script src="live.js"></script></body></html>
